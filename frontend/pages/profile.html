    <link rel="stylesheet" href="../css/screens.css">
</head>

    <nav class="landing-nav" id="main-nav">
        <div class="nav-container">
            <a href="../index.html" class="brand-wrapper" aria-label="HuntYourTrack Home">
                <span class="brand-mark">
                    <svg class="brand-h-svg" width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true">

                            <linearGradient id="hytNavL" x1="12" y1="8" x2="26" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22F5EA"/><stop offset="55%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
                            <linearGradient id="hytNavR" x1="36" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#1E3A8A"/></linearGradient>
                            <linearGradient id="hytNavA" x1="4" y1="42" x2="59" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="35%" stop-color="#BAE6FD"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient>
                        </defs>
                        <g transform="skewX(-9) translate(8, 0)">

                            <path d="M37 8H45C47.2 8 49 9.8 49 12V48C49 52.4 45.4 56 41 56H37V8Z" fill="url(#hytNavR)"/>
                        </g>
                        <path class="hyt-logo-arrow" d="M5.5 39.5C13.5 31.5 29.5 27.5 43.5 26.8L41.8 20.6L59.2 27.2L44.2 38.4L44.8 32.1C31.2 32.8 17.5 36.2 8.2 42.6C5.8 44.1 3.7 41.3 5.5 39.5Z" fill="url(#hytNavA)"/>
                    </svg>
                </span>
                <span class="brand-title"><span class="brand-word-hunt">Hunt</span><span class="brand-word-your">Your</span><span class="brand-word-track">Track</span></span>
            </a>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="explore.html" class="nav-link">Explore</a></li>
                <li><a href="../index.html#courses" class="nav-link">Courses</a></li>
                <li><a href="../index.html#opportunities" class="nav-link">Internships</a></li>
            </ul>

            <div class="nav-cta-group">
                <a href="profile.html" id="hyt-fav-nav-btn" class="nav-util-btn nav-icon-only-btn" aria-label="Saved Favorites" title="Saved Favorites" style="color: var(--color-primary); border-color: var(--color-primary);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                </a>
                <button id="hyt-theme-btn" class="nav-util-btn nav-icon-only-btn" type="button" aria-label="Toggle Dark/Light Mode" onclick="window.hytI18n && window.hytI18n.toggleTheme()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <div id="subpage-auth-actions" style="display: flex; gap: 0.5rem; align-items: center;">
                    <a href="auth.html" class="btn btn-primary" style="padding: 0.45rem 0.95rem; font-size: 0.85rem;">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="explore-shell" style="max-width: 1080px;">
        <section class="explore-header-banner ms-fade-up">
            <span class="section-badge">Screen 9 · Profile, Favorites &amp; Settings</span>
            <h1 style="font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 0.45rem 0 0.35rem;">Your Saved Learning &amp; Preferences</h1>
            <p style="margin: 0; color: var(--color-muted-foreground);">
                Manage bookmarked MOOCs, saved internships, deadline notifications, and your personalized track settings.
            </p>

            <div class="profile-tabs" style="margin-top: 1.25rem; margin-bottom: 0;" id="profile-tabs-bar">
                <button type="button" class="profile-tab-btn active" onclick="switchProfileTab('favorites', this)">Saved Favorites</button>
                <button type="button" class="profile-tab-btn" onclick="switchProfileTab('enrolled', this)">Enrolled Courses</button>
                <button type="button" class="profile-tab-btn" onclick="switchProfileTab('notifications', this)">Notifications</button>
                <button type="button" class="profile-tab-btn" onclick="switchProfileTab('settings', this)">Profile &amp; Settings</button>
            </div>
        </section>

        <section id="profile-tab-content" class="ms-fade-up"></section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile App Navigation">
        <a href="../index.html" class="mobile-bottom-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Home</span>
        </a>
        <a href="explore.html" class="mobile-bottom-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Explore</span>
        </a>
        <a href="student.html" class="mobile-bottom-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Hub</span>
        </a>
        <a href="profile.html" class="mobile-bottom-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="../js/i18n.js"></script>
    <script src="../js/opportunities.js"></script>
    <script src="../js/catalog-store.js"></script>
    <script>
        let currentTab = 'favorites';

        function switchProfileTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('#profile-tabs-bar .profile-tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderProfileTab();
        }

        function removeFav(type, id) {
            if (!window.HYT_CATALOG) return;
            window.HYT_CATALOG.toggleFavorite(type, id);
            renderProfileTab();
        }

        function markAllRead() {
            if (!window.HYT_CATALOG) return;
            window.HYT_CATALOG.markAllNotificationsRead();
            renderProfileTab();
        }

        function saveQuickSettings(e) {
            e.preventDefault();
            if (!window.HYT_CATALOG) return;
            const faculty = document.getElementById('pref-faculty').value;
            const goal = document.getElementById('pref-goal').value;
            window.HYT_CATALOG.saveOnboardingPrefs({ faculty, goal, skills: [] });
            const status = document.getElementById('settings-status');
            if (status) status.textContent = 'Preferences saved locally.';
        }

        function renderProfileTab() {
            const store = window.HYT_CATALOG;
            const container = document.getElementById('profile-tab-content');
            if (!store || !container) return;

            if (currentTab === 'favorites') {
                const favs = store.getFavorites();
                const courses = favs.courses.map(id => store.getCourseById(id)).filter(Boolean);
                const opps = favs.opportunities.map(id => store.getOpportunityById(id)).filter(Boolean);

                if (courses.length === 0 && opps.length === 0) {
                    container.innerHTML = `
                        <div class="panel" style="text-align: center; padding: 3rem 1.5rem;">
                            <h3>No saved favorites yet</h3>
                            <p style="color: var(--color-muted-foreground); margin-bottom: 1.25rem;">Bookmark free courses or internships from Explore to track them here.</p>
                            <a href="explore.html" class="btn btn-primary">Explore Free Courses &amp; Internships →</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="explore-results-grid">
                        ${courses.map(c => `
                            <article class="cc-card">
                                <div class="cc-card-body">
                                    <span class="section-badge" style="align-self: flex-start;">Saved Course · ${c.platform}</span>
                                    <h3 class="cc-card-title">${c.title}</h3>
                                    <p style="margin: 0; font-size: 0.85rem; color: var(--color-muted-foreground);">${c.provider}</p>
                                    <div class="cc-card-actions">
                                        <a href="details.html?type=course&id=${encodeURIComponent(c.id)}" class="btn btn-primary" style="flex: 1; text-align: center; font-size: 0.82rem; padding: 0.45rem;">Open Details</a>
                                        <button type="button" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.45rem 0.75rem;" onclick="removeFav('course', '${c.id}')">Remove</button>
                                    </div>
                                </div>
                            </article>
                        `).join('')}
                        ${opps.map(o => `
                            <article class="cc-card">
                                <div class="cc-card-body">
                                    <span class="section-badge" style="align-self: flex-start;">Saved Internship</span>
                                    <h3 class="cc-card-title">${o.titleEn || o.title}</h3>
                                    <p style="margin: 0; font-size: 0.85rem; color: var(--color-muted-foreground);">${o.orgNameEn || o.orgName}</p>
                                    <div class="cc-card-actions">
                                        <a href="details.html?type=internship&id=${encodeURIComponent(o.id)}" class="btn btn-primary" style="flex: 1; text-align: center; font-size: 0.82rem; padding: 0.45rem;">Open Details</a>
                                        <button type="button" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.45rem 0.75rem;" onclick="removeFav('internship', '${o.id}')">Remove</button>
                                    </div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'enrolled') {
                const enrolledIds = store.getEnrolledCourses();
                const courses = enrolledIds.map(id => store.getCourseById(id)).filter(Boolean);
                container.innerHTML = `
                    <div class="explore-results-grid">
                        ${courses.map(c => `
                            <article class="cc-card">
                                <div class="cc-card-body">
                                    <span class="section-badge" style="align-self: flex-start;">Enrolled · Free Audit</span>
                                    <h3 class="cc-card-title">${c.title}</h3>
                                    <p style="margin: 0; font-size: 0.85rem; color: var(--color-muted-foreground);">${c.provider} · ${c.duration}</p>
                                    <div class="cc-card-actions">
                                        <a href="${c.enrollmentUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="flex: 1; text-align: center; font-size: 0.82rem; padding: 0.45rem;">Continue on ${c.platform} →</a>
                                        <a href="details.html?type=course&id=${encodeURIComponent(c.id)}" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.45rem 0.75rem;">Syllabus</a>
                                    </div>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'notifications') {
                const notifs = store.getNotifications();
                container.innerHTML = `
                    <div class="panel" style="padding: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h2 style="margin: 0; font-size: 1.2rem;">Alerts &amp; Deadlines</h2>
                            <button type="button" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.4rem 0.8rem;" onclick="markAllRead()">Mark All Read</button>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                            ${notifs.map(n => `
                                <div class="syllabus-item" style="justify-content: space-between; flex-wrap: wrap; opacity: ${n.read ? '0.68' : '1'};">
                                    <div>
                                        <div style="font-weight: 700;">${n.title}</div>
                                        <small style="color: var(--color-muted-foreground);">${n.body}</small>
                                    </div>
                                    <a href="${n.link}" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">View →</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                const prefs = store.getOnboardingPrefs() || { faculty: 'computers-ai', goal: 'Free MOOCs & Certificates' };
                container.innerHTML = `
                    <div class="panel" style="padding: 1.5rem; max-width: 640px;">
                        <h2 style="margin: 0 0 1rem; font-size: 1.25rem;">Personalization &amp; App Settings</h2>
                        <form onsubmit="saveQuickSettings(event)" style="display: flex; flex-direction: column; gap: 1rem;">
                            <div class="form-group">
                                <label for="pref-faculty">Preferred Discipline</label>
                                <select id="pref-faculty" class="form-control">
                                    <option value="computers-ai" ${prefs.faculty === 'computers-ai' ? 'selected' : ''}>Computing &amp; AI</option>
                                    <option value="engineering" ${prefs.faculty === 'engineering' ? 'selected' : ''}>Engineering</option>
                                    <option value="business" ${prefs.faculty === 'business' ? 'selected' : ''}>Business &amp; FinTech</option>
                                    <option value="science" ${prefs.faculty === 'science' ? 'selected' : ''}>Science &amp; Biotech</option>
                                    <option value="law" ${prefs.faculty === 'law' ? 'selected' : ''}>Law &amp; Governance</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="pref-goal">Primary Career Goal</label>
                                <select id="pref-goal" class="form-control">
                                    <option value="Free MOOCs & Certificates" ${prefs.goal === 'Free MOOCs & Certificates' ? 'selected' : ''}>Learn for Free (MOOCs)</option>
                                    <option value="Summer Internships" ${prefs.goal === 'Summer Internships' ? 'selected' : ''}>Land an Internship</option>
                                    <option value="Full Career Roadmap" ${prefs.goal === 'Full Career Roadmap' ? 'selected' : ''}>Follow a Career Track</option>
                                </select>
                            </div>
                            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
                                <button type="submit" class="btn btn-primary">Save Preferences</button>
                                <button type="button" class="btn btn-secondary" onclick="window.hytI18n && window.hytI18n.toggleTheme()">Toggle Dark / Light Mode</button>
                                <a href="onboarding.html" class="btn btn-secondary">Re-run Onboarding Wizard</a>
                            </div>
                            <div id="settings-status" style="font-size: 0.85rem; color: var(--color-accent); font-weight: 600;"></div>
                        </form>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HYT_CATALOG) window.HYT_CATALOG.renderHeaderAuth('subpage-auth-actions');
            renderProfileTab();
        });
    </script>
</body>
</html>
