<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title data-i18n="authPageTitle">HuntYourTrack · Student & Partner Portal Access</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">
    
 <!-- Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="../css/style.css">
 <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

 <!-- Top Navigation Bar -->
 <header class="auth-top-bar">
 <a href="../index.html" class="auth-brand brand-wrapper" aria-label="HuntYourTrack Home">
     <span class="brand-mark" style="width: 32px; height: 32px; border-radius: 9px;">
         <svg class="brand-h-svg" width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                        <defs>
                            <linearGradient id="hytNavL" x1="12" y1="8" x2="26" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22F5EA"/><stop offset="55%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
                            <linearGradient id="hytNavR" x1="36" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#1E3A8A"/></linearGradient>
                            <linearGradient id="hytNavA" x1="4" y1="42" x2="59" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="35%" stop-color="#BAE6FD"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient>
                        </defs>
                        <g transform="skewX(-9) translate(8, 0)">
                            <path d="M12 16C12 11.6 15.6 8 20 8H24V48C24 52.4 20.4 56 16 56H12V16Z" fill="url(#hytNavL)"/>
                            <path d="M22 28C27 23 34 22 39 24V33C34 31 27 32 22 36V28Z" fill="url(#hytNavR)"/>
                            <path d="M37 8H45C47.2 8 49 9.8 49 12V48C49 52.4 45.4 56 41 56H37V8Z" fill="url(#hytNavR)"/>
                        </g>
                        <path class="hyt-logo-arrow" d="M5.5 39.5C13.5 31.5 29.5 27.5 43.5 26.8L41.8 20.6L59.2 27.2L44.2 38.4L44.8 32.1C31.2 32.8 17.5 36.2 8.2 42.6C5.8 44.1 3.7 41.3 5.5 39.5Z" fill="url(#hytNavA)"/>
                    </svg>
     </span>
     <span class="brand-title" dir="ltr" style="font-size: 1.15rem; display: inline-flex; direction: ltr; unicode-bidi: isolate;">
         <span class="brand-word-hunt">Hunt</span><span class="brand-word-your">Your</span><span class="brand-word-track">Track</span>
     </span>
 </a>
 <div class="auth-nav-actions">
 
 <button id="hyt-theme-toggle" class="nav-util-btn" type="button" aria-label="Toggle Theme"></button>
 <a href="../index.html" class="btn btn-secondary" style="min-height: 40px; padding: 0.4rem 0.9rem; font-size: 0.85rem;" data-i18n="navExploreHome">Explore Home</a>
 </div>
 </header>

 <!-- Centered Form Container -->
 <main class="auth-centered-wrapper">
 <div class="auth-split-card">
 
 <!-- Left Visual Panel (Clean & Minimal) -->
 <section class="auth-visual-hero" style="justify-content: center; gap: 1rem;">
 <div>
 <h1 id="visual-title" style="margin-bottom: 0.65rem;">HuntYourTrack</h1>
 <p id="visual-desc" style="font-size: 1.02rem; opacity: 0.92; margin: 0;">Free courses from top universities &amp; verified internships in one place.</p>
 </div>
 </section>

 <!-- Right Form Panel -->
 <section class="auth-form-panel">
 <div class="auth-form-header">
 <h2 id="form-title" data-i18n="authWelcomeBack">Sign In</h2>
 <p id="form-subtitle" data-i18n="authAccessSub">Access your personalized career roadmap and dashboard.</p>
 </div>

 <!-- Tabs: Login vs Register -->
 <div class="tab-switcher" role="tablist">
 <button class="tab-btn active" id="btn-login" type="button" role="tab" aria-selected="true" onclick="switchAuthTab('login')" data-i18n="navSignIn">Sign In</button>
 <button class="tab-btn" id="btn-signup" type="button" role="tab" aria-selected="false" onclick="switchAuthTab('signup')" data-i18n="authJoinFuture">Create New Account</button>
 </div>

 <!-- Forms Area -->
 <div class="auth-forms-container">
 
 <!-- Login Form -->
 <form id="login-form" class="auth-form" onsubmit="handleLoginSubmit(event)">
 <div class="form-group">
 <label for="login-email" data-i18n="loginEmailLabel">University / Work Email</label>
 <input id="login-email" name="email" type="email" class="form-control" placeholder="name@university.edu" list="saved-emails-list" autocomplete="email" required>
 <datalist id="saved-emails-list"></datalist>
 </div>

 <div id="saved-accounts-container" style="display: none; margin-bottom: 1rem;"></div>

 <div class="form-group">
 <label for="login-password" data-i18n="loginPasswordLabel">Password</label>
 <div class="password-wrapper">
 <input id="login-password" name="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
 <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('login-password', this)">
 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
 </button>
 </div>
 </div>

 <button type="submit" class="btn btn-primary auth-submit-btn" id="login-submit-btn" data-i18n="navSignIn">Sign In</button>
 </form>

 <!-- Signup Form -->
 <form id="signup-form" class="auth-form form-hidden" onsubmit="handleSignupSubmit(event)">
 <div class="form-group">
 <label for="signup-name" data-i18n="signupNameLabel">Full Name</label>
 <input id="signup-name" name="name" type="text" class="form-control" placeholder="Full Name" required>
 </div>

 <div class="form-group">
 <label for="signup-email" data-i18n="signupEmailLabel">University / Work Email</label>
 <input id="signup-email" name="email" type="email" class="form-control" placeholder="name@university.edu" required>
 </div>

 <div class="form-group">
 <label for="signup-faculty" data-i18n="facultyLabel">Faculty / Academic Track:</label>
 <select id="signup-faculty" name="faculty" class="form-control" onchange="updateDepartmentOptions(this.value)" required>
 <option value="computers" data-i18n="facultyComputers" selected>Faculty of Computers & Artificial Intelligence</option>
 <option value="engineering" data-i18n="facultyEngineering">Faculty of Engineering</option>
 <option value="commerce" data-i18n="facultyCommerce">Faculty of Commerce & Business Administration</option>
 <option value="law" data-i18n="facultyLaw">Faculty of Law</option>
 <option value="other" data-i18n="facultyOther">Other / General Discipline</option>
 </select>
 </div>

 <div class="form-group">
 <label for="signup-dept" data-i18n="departmentLabel">Academic Department:</label>
 <select id="signup-dept" name="department" class="form-control" required>
 <option value="cs" data-i18n="deptCs">Computer Science (CS)</option>
 <option value="ai" data-i18n="deptAi">Artificial Intelligence (AI)</option>
 <option value="is" data-i18n="deptIs">Information Systems (IS)</option>
 <option value="it" data-i18n="deptIt">Information Technology (IT)</option>
 <option value="cyber" data-i18n="deptCyber">Cybersecurity</option>
 </select>
 </div>

 <div class="form-group">
 <label for="signup-role" data-i18n="signupRoleLabel">Account Role</label>
 <select id="signup-role" name="role" class="form-control" required>
 <option value="student" data-i18n="roleStudentOpt" selected>Student Explorer Account</option>
 <option value="employer" data-i18n="roleEmployerOpt">Employer Partner Account</option>
 </select>
 </div>

 <div class="form-group">
 <label for="signup-password" data-i18n="signupPassLabel">Password (8+ characters)</label>
 <div class="password-wrapper">
 <input id="signup-password" name="password" type="password" class="form-control" placeholder="••••••••" minlength="8" required>
 <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('signup-password', this)">
 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
 </button>
 </div>
 </div>

 <button type="submit" class="btn btn-accent auth-submit-btn" id="signup-submit-btn" data-i18n="createAccountBtn">Create Account & Activate Track →</button>
 </form>
 </div>

 <div class="auth-status-line" id="auth-status" role="status" aria-live="polite"></div>
 </section>
 </div>
 </main>

 <div class="toast-container" id="toast-container" aria-live="polite"></div>

 <!-- Scripts -->
 <script src="../js/i18n.js"></script>
 <script src="../js/api.js"></script>
 <script src="../js/ocean-background.js"></script>
 <script src="../js/auth.js"></script>
</body>
</html>
