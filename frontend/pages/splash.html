<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuntYourTrack · Welcome</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/screens.css">
</head>
<body class="gd-mesh-bg">
    <main class="splash-viewport">
        <div class="splash-orb-ring ms-fade-up" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6"/>
                <circle cx="16" cy="16" r="7.5" stroke="currentColor" stroke-width="2"/>
                <circle cx="16" cy="16" r="2.8" fill="currentColor"/>
                <path d="M16 2V6M16 26V30M2 16H6M26 16H30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 11L27 5M27 5H23M27 5V9" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1 class="ms-fade-up" style="font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin: 0 0 0.6rem; letter-spacing: -0.02em;">
            <span>Hunt</span><span style="color: var(--color-primary);">Your</span><span style="color: var(--color-accent);">Track</span>
        </h1>

        <p class="ms-fade-up" style="max-width: 520px; color: var(--color-muted-foreground); font-size: 1.05rem; line-height: 1.6; margin: 0;">
            Free courses aggregated from top global universities &amp; providers — paired with verified internships and career roadmaps.
        </p>

        <div class="splash-progress-track" aria-label="Loading HuntYourTrack">
            <div class="splash-progress-fill" id="splash-progress"></div>
        </div>

        <div class="ms-fade-up" style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem;">
            <a href="onboarding.html" class="btn btn-primary" id="splash-start-btn" style="padding: 0.8rem 1.8rem;">
                Start Guided Setup →
            </a>
            <a href="../index.html" class="btn btn-secondary" style="padding: 0.8rem 1.4rem;">
                Explore Home
            </a>
        </div>

        <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--color-muted-foreground);">
            Screen 1 of 9 · Splash &amp; Brand Entry
        </p>
    </main>

    <script src="../js/i18n.js"></script>
    <script>
        (function () {
            const fill = document.getElementById('splash-progress');
            let pct = 15;
            const timer = setInterval(() => {
                pct = Math.min(100, pct + 18);
                if (fill) fill.style.width = pct + '%';
                if (pct >= 100) clearInterval(timer);
            }, 300);
        })();
    </script>
</body>
</html>
