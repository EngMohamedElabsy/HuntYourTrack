<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuntYourTrack · Welcome</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/screens.css">
</head>
<body class="gd-mesh-bg">
    <main class="splash-viewport">
        <div class="splash-orb-ring ms-fade-up" aria-hidden="true">
            <svg class="brand-h-svg" width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                        <defs>
                            <linearGradient id="hytNavL" x1="12" y1="8" x2="26" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22F5EA"/><stop offset="55%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
                            <linearGradient id="hytNavR" x1="36" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#1E3A8A"/></linearGradient>
                            <linearGradient id="hytNavA" x1="4" y1="42" x2="59" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="35%" stop-color="#BAE6FD"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient>
                        </defs>
                        <g transform="skewX(-9) translate(8, 0)">
                            <path d="M12 16C12 11.6 15.6 8 20 8H24V48C24 52.4 20.4 56 16 56H12V16Z" fill="url(#hytNavL)"/>
                            <path d="M22 28C27 23 34 22 39 24V33C34 31 27 32 22 36V28Z" fill="url(#hytNavR)"/>
                            <path d="M37 8H45C47.2 8 49 9.8 49 12V48C49 52.4 45.4 56 41 56H37V8Z" fill="url(#hytNavR)"/>
                        </g>
                        <path class="hyt-logo-arrow" d="M5.5 39.5C13.5 31.5 29.5 27.5 43.5 26.8L41.8 20.6L59.2 27.2L44.2 38.4L44.8 32.1C31.2 32.8 17.5 36.2 8.2 42.6C5.8 44.1 3.7 41.3 5.5 39.5Z" fill="url(#hytNavA)"/>
                    </svg>
        </div>

        <h1 class="ms-fade-up" style="font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin: 0 0 0.6rem; letter-spacing: -0.02em;">
            <span>Hunt</span><span style="color: var(--color-primary);">Your</span><span style="color: var(--color-accent);">Track</span>
        </h1>

        <p class="ms-fade-up" style="max-width: 520px; color: var(--color-muted-foreground); font-size: 1.05rem; line-height: 1.6; margin: 0;">
            Free courses aggregated from top global universities &amp; providers — paired with verified internships and career roadmaps.
        </p>

        <div class="splash-progress-track" aria-label="Loading HuntYourTrack">
            <div class="splash-progress-fill" id="splash-progress"></div>
        </div>

        <div class="ms-fade-up" style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem;">
            <a href="onboarding.html" class="btn btn-primary" id="splash-start-btn" style="padding: 0.8rem 1.8rem;">
                Start Guided Setup →
            </a>
            <a href="../index.html" class="btn btn-secondary" style="padding: 0.8rem 1.4rem;">
                Explore Home
            </a>
        </div>

        <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--color-muted-foreground);">
            Screen 1 of 9 · Splash &amp; Brand Entry
        </p>
    </main>

    <script src="../js/i18n.js"></script>
    <script>
        (function () {
            const fill = document.getElementById('splash-progress');
            let pct = 15;
            const timer = setInterval(() => {
                pct = Math.min(100, pct + 18);
                if (fill) fill.style.width = pct + '%';
                if (pct >= 100) clearInterval(timer);
            }, 300);
        })();
    </script>
</body>
</html>
