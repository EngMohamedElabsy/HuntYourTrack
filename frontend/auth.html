<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuntYourTrack | AI Career Matcher</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-wrapper" id="auth-wrapper">
        <section class="visual-panel" id="visual-panel">
            <h1 id="visual-title">HuntYourTrack</h1>
            <p id="visual-desc">Empowering students to discover their potential and bridging the gap to professional excellence.</p>
            <div class="visual-eyebrow">GRADUATION PROJECT 2026</div>
        </section>

        <section class="form-panel" id="form-panel">
            <div class="auth-card">
                <h2 id="form-title">Welcome Back</h2>
                <p class="subtitle" id="form-subtitle">Access your personalized career path.</p>

                <div class="tab-container">
                    <div class="tab-slider" id="slider"></div>
                    <button class="tab-btn active" id="btn-login" type="button" aria-pressed="true" onclick="switchTab('login')">Sign In</button>
                    <button class="tab-btn" id="btn-signup" type="button" aria-pressed="false" onclick="switchTab('signup')">Create Account</button>
                </div>

                <div class="form-container">
                    <form id="login-form" class="form-content" data-auth-mode="login">
                        <div class="form-group">
                            <label for="login-email">University Email</label>
                            <input id="login-email" name="email" type="email" class="form-control" placeholder="student@university.edu" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input id="login-password" name="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary auth-submit">Enter Platform</button>
                        <div class="auth-footer">
                            <a href="#" id="forgot-password-link">Forgot Password?</a>
                        </div>
                    </form>

                    <form id="signup-form" class="form-content form-hidden" data-auth-mode="register" aria-hidden="true" inert>
                        <div class="form-group">
                            <label for="signup-name">Full Name</label>
                            <input id="signup-name" name="name" type="text" class="form-control" placeholder="Enter your full name" autocomplete="name" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-email">University Email</label>
                            <input id="signup-email" name="email" type="email" class="form-control" placeholder="student@university.edu" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-faculty">Faculty</label>
                            <input id="signup-faculty" name="faculty" type="text" class="form-control" placeholder="Enter your faculty" autocomplete="organization-title" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input id="signup-password" name="password" type="password" class="form-control" placeholder="Create a strong password (8+ characters)" autocomplete="new-password" minlength="8" required>
                        </div>
                        <button type="submit" class="btn btn-accent auth-submit">Create Account</button>
                    </form>
                </div>
                <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
            </div>
        </section>
    </div>

    <dialog class="auth-dialog" id="forgot-password-dialog" aria-labelledby="forgot-password-title">
        <form id="forgot-password-form" data-auth-mode="password-reset">
            <h2 id="forgot-password-title">Reset your password</h2>
            <p class="subtitle">Enter your university email and we will send a reset link.</p>
            <div class="form-group">
                <label for="reset-email">University Email</label>
                <input id="reset-email" name="email" type="email" class="form-control" autocomplete="email" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
            <button type="button" class="btn btn-secondary" id="close-reset-dialog">Cancel</button>
            <p class="auth-status" role="status" aria-live="polite"></p>
        </form>
    </dialog>

    <script src="auth.js"></script>
</body>
</html>
