<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Orbital Trajectory Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6" transform="rotate(-30 32 32)" />
  
  <!-- Celestial 4-Point Sparkle / Hunter Reticle -->
  <path d="M 32 10 Q 32 32 10 32 Q 32 32 32 54 Q 32 32 54 32 Q 32 32 32 10 Z" fill="url(#hytGrad)" filter="url(#glow)" />
  
  <!-- Core Target Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#0284c7" />
</svg>
