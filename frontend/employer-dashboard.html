<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | HuntYourTrack</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">HuntYourTrack</div>
        <nav>
            <a href="#" class="nav-item">🏠 Dashboard</a>
            <a href="#" class="nav-item active">💼 My Internships</a>
            <a href="#" class="nav-item">👥 Applications</a>
            <a href="#" class="nav-item">⚙️ Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Employer Dashboard</h1>
            <button class="btn btn-primary" onclick="toggleModal('post-modal')">+ Post New Internship</button>
        </header>

        <div class="card">
            <h2 style="margin-bottom: 1rem; font-family: var(--font-heading);">Active Internships</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Track</th>
                        <th>Type</th>
                        <th>Deadline</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Frontend Developer Intern</td>
                        <td>Web Development</td>
                        <td><span class="badge badge-free">Free</span></td>
                        <td>2026-12-01</td>
                        <td><button class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Edit</button></td>
                    </tr>
                    <tr>
                        <td>AI Research Intern</td>
                        <td>Data Science</td>
                        <td><span class="badge badge-paid">Paid</span></td>
                        <td>2026-11-15</td>
                        <td><button class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Edit</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Modal for Posting Internship -->
        <div id="post-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
            <div class="card" style="width: 500px; max-width: 90%; position: relative;">
                <h2 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Post New Internship</h2>
                <form>
                    <div class="form-group">
                        <label>Internship Title</label>
                        <input type="text" class="form-control" placeholder="e.g. Junior Backend Engineer">
                    </div>
                    <div class="form-group">
                        <label>Track/Field</label>
                        <input type="text" class="form-control" placeholder="e.g. Node.js / Python">
                    </div>
                    <div class="form-group">
                        <label>Required Skills (Comma separated)</label>
                        <textarea class="form-control" rows="3" placeholder="e.g. JavaScript, MongoDB, REST API"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select class="form-control">
                            <option value="free">Free</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Application Deadline</label>
                        <input type="date" class="form-control">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 2rem;">
                        <button type="button" class="btn" style="background:#ccc;" onclick="toggleModal('post-modal')">Cancel</button>
                        <button type="submit" class="btn btn-accent">Publish Internship</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = modal.style.display === 'none' || modal.style.display === '' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
