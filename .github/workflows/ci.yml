name: Frontend Smoke & Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Automated Browser Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Frontend Smoke Test Suite
        run: |
          npm test

      - name: Generate Visual Executive CI Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 Frontend Smoke & Quality Gate Verification Report

          > **HuntYourTrack** · Graduation Project 2026 (Faculty of Computers & Information, Damanhour University)

          ### 📊 Quality Gate & Test Execution Matrix
          | Component / Gateway | Target Route | Status | Result |
          | :--- | :--- | :---: | :---: |
          | 🔐 **Authentication & 1-Click Demo** | `frontend/auth.html` | 🟢 Verified | Passed |
          | 🎓 **Student Career Hub** | `frontend/index.html` | 🟢 Verified | Passed |
          | 🛡️ **Admin Executive Console** | `frontend/admin.html` | 🟢 Verified | Passed |
          | 🏢 **Corporate Accreditation Queue** | `frontend/admin.html#tab-verification` | 🟢 Verified | Passed |
          | 🧩 **Core UI Component Kit** | `frontend/components.html` | 🟢 Verified | Passed |
          | 🗺️ **System Architecture & Workflow Map** | `frontend/workflow.html` | 🟢 Verified | Passed |

          ```mermaid
          graph LR
              A[🔐 Auth Gateway] --> B[🎓 Student Portal]
              A --> C[🛡️ Admin Console]
              C --> D[🏢 Verification Queue]
              A --> E[🧩 UI Kit]
              B & C & D & E --> F[🧪 CI Smoke Suite: Passed]
              F --> G[🚀 GitHub Pages Deployment]
          ```

          ---
          *Verified by Autonomous CI Pipeline on Ubuntu Runner.*
          EOF
